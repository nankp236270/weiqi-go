# 圍棋 AI 自動訓練配置文件
# 修改此文件後，重啟訓練即可生效

[training]
# 每輪訓練的迭代次數
# 建議: 快速測試=3, 標準=10, 深度=20
iterations = 10

# 每次迭代的自我對弈局數
# 建議: 快速測試=10, 標準=30, 深度=50
self_play_games = 30

# 每次迭代的評估局數
# 建議: 快速測試=10, 標準=20, 深度=40
eval_games = 20

# MCTS 模擬次數（每步）
# 建議: 快速測試=100, 標準=200, 深度=400
simulations = 200

# 神經網絡訓練輪數
# 建議: 快速測試=5, 標準=10, 深度=20
epochs = 10

# 批次大小
# 建議: 內存小=32, 標準=64, 內存大=128
batch_size = 64

# 學習率
# 建議: 0.0005 - 0.002
learning_rate = 0.001

[evaluation]
# 評估時的 MCTS 模擬次數
# 建議: 訓練時的 2 倍
eval_simulations = 400

# 新模型必須達到的最小勝率才會被採用
# 建議: 0.52 - 0.60 (越高越嚴格)
min_win_rate = 0.55

[system]
# 訓練設備 (cpu 或 cuda)
device = cpu

# 保留的失敗訓練目錄數量
keep_failed_dirs = 3

# 每輪訓練之間的等待時間（秒）
wait_between_rounds = 10

[presets]
# 預設配置（取消註釋以使用）

# 快速測試配置（15-30 分鐘/輪）
